[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SecureVault"
version = "1.0.0"
description = "A secure command-line password manager built with Python."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Rohit Pujari" }
]

dependencies = [
    "bcrypt>=5.0.0",
    "cryptography>=50.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py313"]